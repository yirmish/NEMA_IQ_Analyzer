name: release

# Creates the tag v<version> and a GitHub release with NEMA_IQ_Analyzer.html, SHA256SUMS.txt and the demo dataset
# (demo/NEMA_IQ_demo_digital_phantom.zip), after the tests pass and the version and release date agree in src/core.js,
# NEMA_IQ_Analyzer.html, CITATION.cff and CHANGELOG.md. Start it from the Actions tab on main (version x.y.z), or push
# the tag vx.y.z. Run again for a version that is already released, it adds the missing files (taken from the tag) to a
# release that is still mutable; immutable releases (repository setting) cannot be changed and need a new version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.0.1'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUESTED: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version and release date
        run: |
          v="${REQUESTED#v}"
          fail() { echo "::error::$1"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then fail "run the release from main"; fi
          grep -qF "N.VERSION = '$v';" src/core.js || fail "src/core.js: N.VERSION is not $v"
          grep -qF "N.VERSION = '$v';" NEMA_IQ_Analyzer.html || fail "NEMA_IQ_Analyzer.html is not built from version $v"
          grep -qx "version: \"$v\"" CITATION.cff || fail "CITATION.cff: version is not $v"
          date=$(sed -n "s/^## $v — \([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\)\$/\1/p" CHANGELOG.md)
          [ -n "$date" ] || fail "CHANGELOG.md: no section '## $v — YYYY-MM-DD'"
          grep -qx "date-released: \"$date\"" CITATION.cff || fail "CITATION.cff: date-released is not $date (CHANGELOG.md)"
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/NEMA_IQ_Analyzer.html"
          { echo "**Try it online:** <$site?demo=1>  "
            echo "**Demo dataset:** \`NEMA_IQ_demo_digital_phantom.zip\` (attached; digital IEC phantom as PET DICOM, no patient or site data). Drag it onto \`NEMA_IQ_Analyzer.html\` and choose NU 2-2012."
            echo
            awk -v h="## $VERSION " 'index($0, h) == 1 {f = 1; next} f && /^## / {exit} f' CHANGELOG.md; } > "$RUNNER_TEMP/notes.md"
      - name: Create tag and release, or add missing files to an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(NEMA_IQ_Analyzer.html SHA256SUMS.txt demo/NEMA_IQ_demo_digital_phantom.zip)
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" --jq .immutable)" = true ]; then
              echo "::error::release v$VERSION is immutable: files cannot be added after publication; release a new version"; exit 1
            fi
            git fetch --depth=1 origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
            have=$(gh release view "v$VERSION" --json assets --jq '.assets[].name')
            mkdir -p "$RUNNER_TEMP/assets"
            for f in "${assets[@]}"; do
              n=$(basename "$f")
              if grep -qxF "$n" <<< "$have"; then echo "$n: already attached"; continue; fi
              git show "v$VERSION:$f" > "$RUNNER_TEMP/assets/$n" || { echo "::error::$f is not in tag v$VERSION"; exit 1; }
              gh release upload "v$VERSION" "$RUNNER_TEMP/assets/$n"
              echo "$n: attached"
            done
          else
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then target=(--target "$GITHUB_SHA"); else target=(--verify-tag); fi
            gh release create "v$VERSION" "${assets[@]}" "${target[@]}" \
              --title "NEMA IQ Analyzer $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
